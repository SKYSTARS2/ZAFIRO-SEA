<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم زافيرو سي | Zafiro Sea Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #02070e;
            --gold-primary: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --card-bg: rgba(6, 18, 32, 0.85);
            --glass-border: rgba(212, 175, 55, 0.25);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); padding: 20px; direction: rtl; }
        .header { text-align: center; margin-bottom: 30px; padding: 20px; background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 15px; }
        .header h1 { color: var(--gold-primary); font-size: 26px; margin-bottom: 5px; }
        .header p { color: var(--text-sub); font-size: 14px; }
        
        .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card h2 { font-size: 18px; color: var(--gold-primary); margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--gold-primary); }
        
        .btn { background: var(--gold-gradient); color: #02070e; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(212,175,55,0.3); }
        .btn:hover { transform: translateY(-2px); }
        .file-input-box { border: 2px dashed var(--glass-border); padding: 15px; text-align: center; border-radius: 8px; cursor: pointer; background: rgba(255,255,255,0.02); }
        .file-input-box input { display: none; }
        .preview-img { width: 80px; height: 60px; object-fit: cover; border-radius: 6px; margin-top: 8px; border: 1px solid var(--gold-primary); }
        .actions-bar { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-ship"></i> لوحة تحكم موقع زافيرو سي</h1>
            <p>قم بتعديل الأسعار والرحلات، وارفع الصور مباشرة من جهازك بكل سهولة</p>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-list-check"></i> اختر الرحلة للتعديل</h2>
            <div class="form-group">
                <label>اختر الرحلة:</label>
                <select id="tripSelector" onchange="loadTripData()">
                    <option value="daily-diving">Daily Diving (الغوص اليومي)</option>
                    <option value="hula-hula">Hula Hula Island (جزيرة هولا هولا)</option>
                    <option value="magawish">Magawish Island (جزيرة مجاويش)</option>
                    <option value="mountain-safari">Mountain Safari (السفاري الجبلية)</option>
                    <option value="paradise-submarine">Paradise Submarine (الغواصة والسنوركلينج)</option>
                    <option value="speedboat">Private Speedboat (السبيد بوت الخاص)</option>
                    <option value="introductory-dive">Introductory Dive (الغوص الاستكشافي)</option>
                    <option value="orange-bay">Orange Bay Island (جزيرة أورانج باي)</option>
                    <option value="private-boat">Private Yacht Charter (تأجير يخت خاص)</option>
                    <option value="sunset-private">Sunset Private Yacht (يخت خاص للغروب)</option>
                </select>
            </div>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-pen-to-square"></i> تفاصيل الرحلة المختارة</h2>
            <div class="form-group">
                <label>عنوان الرحلة (بالعربية):</label>
                <input type="text" id="tripTitleAr">
            </div>
            <div class="form-group">
                <label>عنوان الرحلة (بالإنجليزية):</label>
                <input type="text" id="tripTitleEn">
            </div>
            <div class="form-group">
                <label>السعر (باليورو €):</label>
                <input type="number" id="tripPrice">
            </div>
            <div class="form-group">
                <label>وصف الرحلة المختصر:</label>
                <textarea id="tripDesc" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-image"></i> رفع صورة جديدة للرحلة من الجهاز:</label>
                <div class="file-input-box" onclick="document.getElementById('tripImageFile').click()">
                    <i class="fa-solid fa-cloud-arrow-up" style="font-size: 24px; color: var(--gold-primary); margin-bottom: 5px;"></i>
                    <p style="font-size: 12px; color: var(--text-sub);">اضغط هنا لاختيار صورة من جهازك</p>
                    <input type="file" id="tripImageFile" accept="image/*" onchange="previewImage(event)">
                </div>
                <div id="imagePreviewContainer"></div>
            </div>

            <div class="actions-bar">
                <button class="btn" onclick="saveChanges()"><i class="fa-solid fa-floppy-disk"></i> حفظ وتحديث البيانات محلياً</button>
            </div>
        </div>
    </div>

    <script>
        // بيانات تجريبية تفاعلية للوحة التحكم
        function loadTripData() {
            const select = document.getElementById('tripSelector').value;
            // هنا يتم جلب البيانات لعرضها في الحقول لتعديلها بسهولة
            document.getElementById('tripTitleAr').value = "رحلة بحرية في البحر الأحمر";
            document.getElementById('tripTitleEn').value = "Red Sea Excursion";
            document.getElementById('tripPrice').value = "35";
            document.getElementById('tripDesc').value = "استمتع بأروع الرحلات البحرية في الغردقة.";
            document.getElementById('imagePreviewContainer').innerHTML = "";
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreviewContainer').innerHTML = `<img src="${e.target.result}" class="preview-img" alt="معاينة الصورة">`;
                }
                reader.readAsDataURL(file);
            }
        }

        function saveChanges() {
            alert("تم حفظ التعديلات بنجاح على جهازك محلياً!");
        }

        window.onload = loadTripData;
    </script>
</body>
</html>
