<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAFIRO SEA | رحلات بحرية فاخرة في الغردقة</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Cinzel:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK (Compat v10 - Firestore Only) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-deep: #02070e;
            --gold-primary: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-light: #fbe8a6;
            --card-bg: rgba(6, 18, 32, 0.75);
            --glass-border: rgba(212, 175, 55, 0.22);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; transition: all 0.3s ease; }
        body { background-color: var(--bg-deep); color: var(--text-main); overflow-x: hidden; }

        header { background: rgba(4, 13, 24, 0.9); backdrop-filter: blur(16px); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--glass-border); }
        .logo-title { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
        
        .hero { text-align: center; padding: 50px 20px; background: linear-gradient(180deg, rgba(2, 7, 14, 0.2) 0%, rgba(2, 7, 14, 0.95) 100%), url('https://images.unsplash.com/photo-1544551763-46a013bb70d5?q=80&w=1600') center/cover; }
        .hero h1 { font-size: 36px; font-weight: 900; color: #fff; margin-bottom: 10px; }
        .hero p { color: var(--gold-light); font-size: 14px; font-weight: 700; }

        .container { max-width: 1200px; margin: 30px auto 70px; padding: 0 15px; }
        .trips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }

        .trip-card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid var(--glass-border); display: flex; flex-direction: column; backdrop-filter: blur(10px); }
        .trip-card:hover { transform: translateY(-5px); border-color: var(--gold-primary); }
        .trip-img { width: 100%; height: 220px; object-fit: cover; }
        .trip-content { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .trip-title { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 10px; }
        .trip-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.08); }
        .trip-price { font-size: 22px; font-weight: 900; color: var(--gold-primary); }
        .wa-btn { background: #25d366; color: #fff; padding: 8px 16px; border-radius: 10px; text-decoration: none; font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .wa-btn:hover { background: #20ba5a; }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">ZAFIRO SEA</div>
        <a href="https://wa.me/201031688172" class="wa-btn" target="_blank"><i class="fa-brands fa-whatsapp"></i> تواصل مباشر</a>
    </header>

    <div class="hero">
        <h1>رحلات بحرية استثنائية في الغردقة</h1>
        <p>استمتع بسحر البحر الأحمر مع أسطول سبيد بوت ورحلات الجزر الخاصة</p>
    </div>

    <div class="container">
        <div class="trips-grid" id="clientTripsGrid">
            <!-- سيتم جلب الرحلات أونلاين من سحابة Firebase هنا تلقائياً -->
            <p style="color:var(--text-sub); text-align:center; grid-column:1/-1;">جاري تحميل الرحلات من السحابة...</p>
        </div>
    </div>

    <script>
        // إعدادات Firebase الخاصة بمشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyAQDewTAJ7id6XKSCEKzZKDdMB9dIQwsg4",
            authDomain: "zafirosea.firebaseapp.com",
            projectId: "zafirosea",
            storageBucket: "zafirosea.firebasestorage.app",
            messagingSenderId: "1045236517384",
            appId: "1:1045236517384:web:0ba71a43dae4942fbe1fbd",
            measurementId: "G-4KR8N5MHF9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // جلب الرحلات لحظياً وعرضها للعملاء على الموقع
        db.collection("trips").onSnapshot((snapshot) => {
            const grid = document.getElementById('clientTripsGrid');
            grid.innerHTML = '';

            if(snapshot.empty) {
                grid.innerHTML = `<p style="color:var(--text-sub); text-align:center; grid-column:1/-1;">لا توجد رحلات مضافة حالياً.</p>`;
                return;
            }

            snapshot.forEach((doc) => {
                const t = doc.data();
                const coverImg = (t.images && t.images.length > 0) ? t.images[0] : 'https://images.unsplash.com/photo-1544551763-46a013bb70d5?q=80&w=600';
                const waText = `مرحباً، أرغب في حجز رحلة: ${t.title} بسعر €${t.price}`;

                grid.innerHTML += `
                    <div class="trip-card">
                        <img src="${coverImg}" class="trip-img">
                        <div class="trip-content">
                            <div class="trip-title">${t.title}</div>
                            <p style="color:var(--text-sub); font-size:12.5px; margin-bottom:10px;">التصنيف: ${t.category}</p>
                            <div class="trip-footer">
                                <div class="trip-price">€${t.price}</div>
                                <a href="https://wa.me/201031688172?text=${encodeURIComponent(waText)}" class="wa-btn" target="_blank">
                                    <i class="fa-brands fa-whatsapp"></i> حجز سريع
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
